name: integrity
on: [push, pull_request]

jobs:
  repository-integrity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pandas==3.0.5 openpyxl==3.1.5
      - run: python -m compileall -q scripts tests
      - run: python tests/test_repo_tree.py
      - run: python tests/test_validation_workbook.py
      - run: python tests/test_temporal_outputs.py
      - run: python tests/test_corpus_manifests.py
